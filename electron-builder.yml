appId: com.tokenmonitor.app
productName: TokenMonitor
copyright: Copyright © 2026 TokenMonitor contributors

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - resources/**/*
  - package.json

asar: true
npmRebuild: false

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: TokenMonitor-${version}-Setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TokenMonitor
  uninstallDisplayName: TokenMonitor
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.png
  category: public.app-category.developer-tools
  artifactName: TokenMonitor-${version}-${arch}.${ext}
  # No Apple Developer certificate in CI; skip signing so the build succeeds.
  identity: null

publish: null
