name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: npx electron-builder --mac --publish never
          - os: windows-latest
            package: npx electron-builder --win nsis --x64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build renderer & main
        run: npm run build

      - name: Package installer
        run: ${{ matrix.package }}
        env:
          # No code-signing certificate on CI; skip signing.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Generate SHA256 checksums
        run: node scripts/checksums.mjs release

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.sha256
          if-no-files-found: error

      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.exe
            release/*.sha256
          overwrite_files: true
          generate_release_notes: true
